
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3555:3555"
    depends_on:
      - mongo
    networks:
      - dent-network

  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - dent-network

volumes:
  mongo-data:

networks:
  dent-network:
